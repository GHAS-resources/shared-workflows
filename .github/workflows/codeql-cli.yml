name: CodeQL CLI analysis

on:
  workflow_call:
    inputs:
      detection-mode:
        description: "'automatic' or 'computed'; computed requires a pull request."
        type: string
        default: automatic
      codeql-version:
        description: "CodeQL bundle release tag, such as codeql-bundle-v2.27.4, or latest."
        type: string
        default: latest
      config-file:
        description: Optional CodeQL configuration file relative to the caller's repository root.
        type: string
        default: ""
      fail-on-severity:
        description: "Fail on security findings at or above low, medium, high, or critical; none disables the gate."
        type: string
        default: none
      findings-scope:
        description: "'new' compares PR/merge-group findings with the base analysis; 'all' includes existing findings."
        type: string
        default: new

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  detect:
    uses: ./.github/workflows/codeql-language-detection.yml
    with:
      mode: ${{ inputs.detection-mode }}

  analyze:
    name: CodeQL / ${{ matrix.language }}
    needs: detect
    if: ${{ needs.detect.outputs.has-languages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the analyzed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install CodeQL CLI and bundled queries
        env:
          CODEQL_VERSION: ${{ inputs.codeql-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CODEQL_VERSION" == latest ]]; then
            release_url="https://github.com/github/codeql-action/releases/latest/download"
          elif [[ "$CODEQL_VERSION" =~ ^codeql-bundle-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_url="https://github.com/github/codeql-action/releases/download/$CODEQL_VERSION"
          else
            echo "::error::codeql-version must be 'latest' or a codeql-bundle-vX.Y.Z release tag."
            exit 1
          fi
          case "$RUNNER_OS" in
            Linux) asset="codeql-bundle-linux64.tar.gz" ;;
            macOS) asset="codeql-bundle-osx64.tar.gz" ;;
            *) echo "::error::Unsupported runner OS: $RUNNER_OS"; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/codeql-install"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/$asset" --output "$asset"
          curl --fail --silent --show-error --location --retry 3 \
            "$release_url/$asset.checksum.txt" --output checksum.txt
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 --check checksum.txt
          else
            sha256sum --check checksum.txt
          fi
          tar -xzf "$asset"
          echo "$install_dir/codeql" >> "$GITHUB_PATH"
          "$install_dir/codeql/codeql" version

      - name: Create CodeQL database
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          BUILD_MODE: ${{ matrix.build-mode }}
          CONFIG_FILE: ${{ inputs.config-file }}
        shell: bash
        run: |
          set -euo pipefail
          command=(codeql database create "$RUNNER_TEMP/codeql-database")
          if [[ -n "$CONFIG_FILE" ]]; then
            config_path="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          relative = Path(os.environ["CONFIG_FILE"])
          path = (root / relative).resolve(strict=True)
          if relative.is_absolute() or root not in path.parents or not path.is_file():
              sys.exit("::error::config-file must identify a file inside the caller's repository.")
          print(path)
          PY
            )"
            command+=("--codescanning-config=$config_path")
          fi
          "${command[@]}" \
            --language="$CODEQL_LANGUAGE" \
            --source-root="$GITHUB_WORKSPACE" \
            --build-mode="$BUILD_MODE" \
            --threads=0

      - name: Analyze CodeQL database
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CONFIG_FILE: ${{ inputs.config-file }}
        shell: bash
        run: |
          set -euo pipefail
          command=(codeql database analyze "$RUNNER_TEMP/codeql-database")
          if [[ -z "$CONFIG_FILE" ]]; then
            case "$CODEQL_LANGUAGE" in
              c-cpp) query_language=cpp ;;
              java-kotlin) query_language=java ;;
              javascript-typescript) query_language=javascript ;;
              *) query_language="$CODEQL_LANGUAGE" ;;
            esac
            command+=("codeql/$query_language-queries")
          fi
          "${command[@]}" \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/codeql-results.sarif" \
            --sarif-category="codeql-cli/$CODEQL_LANGUAGE" \
            --threads=0

      - name: Upload code scanning results with the CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out commit does not match the workflow commit."
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | codeql github upload-results \
            --repository="$GITHUB_REPOSITORY" \
            --ref="$GITHUB_REF" \
            --commit="$commit" \
            --sarif="$RUNNER_TEMP/codeql-results.sarif" \
            --github-url="$GITHUB_SERVER_URL" \
            --github-auth-stdin

  severity:
    name: CodeQL severity gate
    needs: [detect, analyze]
    if: ${{ always() && needs.detect.result == 'success' && (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Enforce security severity threshold
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
          FINDINGS_SCOPE: ${{ inputs.findings-scope }}
          LANGUAGE_MATRIX: ${{ needs.detect.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          LEVELS = {"low": 1, "medium": 2, "high": 3, "critical": 4}

          def api(path, **parameters):
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}"
              if parameters:
                  url += "?" + urlencode(parameters)
              request = Request(url, headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          def pages(path, **parameters):
              items = []
              page = 1
              while True:
                  batch = api(path, per_page=100, page=page, **parameters)
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          def analysis(ref, sha, category):
              matches = [
                  item for item in pages("code-scanning/analyses", ref=ref, tool_name="CodeQL")
                  if item["category"] == category
              ]
              if not matches:
                  raise ValueError(f"No {category} baseline/analysis for {ref}. Run this workflow on the base branch first.")
              latest = max(matches, key=lambda item: item["id"])
              if latest["commit_sha"] != sha or latest.get("error"):
                  raise ValueError(f"Missing, stale, or failed {category} analysis for {ref} at {sha}. Rerun its scan.")
              return latest["id"]

          def findings(ref, sha, category, threshold, baseline=False):
              found = {}
              for alert in pages("code-scanning/alerts", ref=ref, tool_name="CodeQL"):
                  if not baseline and alert["state"] == "dismissed":
                      continue
                  severity = alert["rule"].get("security_severity_level")
                  if severity is None:
                      continue  # Non-security code-quality findings have no security severity.
                  if severity not in LEVELS:
                      raise ValueError(f"Unknown security severity for alert {alert['number']}: {severity}")
                  if not baseline and LEVELS[severity] < LEVELS[threshold]:
                      continue
                  # An alert can have instances in multiple categories; do not rely on most_recent_instance.
                  instances = pages(f"code-scanning/alerts/{alert['number']}/instances", ref=ref)
                  if any(
                      instance["category"] == category and instance["commit_sha"] == sha
                      and instance["state"] == "open"
                      for instance in instances
                  ):
                      found[alert["number"]] = severity
              return found

          def evaluate(threshold, scope, matrix, event):
              if threshold not in {*LEVELS, "none"}:
                  raise ValueError("fail-on-severity must be none, low, medium, high, or critical.")
              if scope not in {"new", "all"}:
                  raise ValueError("findings-scope must be new or all.")
              if threshold == "none":
                  return "Security severity gate disabled (fail-on-severity: none).", False
              if not matrix["include"]:
                  return "No supported languages selected; no findings were evaluated.", False
              base = None
              if scope == "new":
                  if "pull_request" in event:
                      base = (f"refs/heads/{event['pull_request']['base']['ref']}", event["pull_request"]["base"]["sha"])
                  elif "merge_group" in event:
                      base = (event["merge_group"]["base_ref"], event["merge_group"]["base_sha"])
                  # Branch scans bootstrap the baseline and gate all current findings.
              effective_scope = "new" if base else "all"
              ref, sha = os.environ["GITHUB_REF"], os.environ["GITHUB_SHA"]
              snapshots = []
              violations = {}
              for entry in matrix["include"]:
                  category = f"codeql-cli/{entry['language']}/"
                  snapshots.append((ref, sha, category, analysis(ref, sha, category)))
                  current = findings(ref, sha, category, threshold)
                  if base:
                      base_ref, base_sha = base
                      snapshots.append((base_ref, base_sha, category, analysis(base_ref, base_sha, category)))
                      existing = findings(base_ref, base_sha, category, threshold, baseline=True)
                      current = {number: severity for number, severity in current.items() if number not in existing}
                  violations.update(current)
              for snapshot_ref, snapshot_sha, category, identifier in snapshots:
                  if analysis(snapshot_ref, snapshot_sha, category) != identifier:
                      raise ValueError("An analysis changed during severity evaluation; rerun the workflow.")
              counts = {level: list(violations.values()).count(level) for level in LEVELS}
              message = (
                  f"Security severity gate: scope={effective_scope}, threshold={threshold} (inclusive). "
                  f"Blocking findings: {len(violations)}; "
                  + ", ".join(f"{level}={count}" for level, count in counts.items())
                  + "."
              )
              return message, bool(violations)

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)
              message, blocked = evaluate(
                  os.environ["FAIL_ON_SEVERITY"], os.environ["FINDINGS_SCOPE"],
                  json.loads(os.environ["LANGUAGE_MATRIX"]), event,
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(message + "\n")
              print(("::error::" if blocked else "") + message)
              if blocked:
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PY

  result:
    name: CodeQL CLI result
    needs: [detect, analyze, severity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report analysis outcome
        env:
          DETECTION_RESULT: ${{ needs.detect.result }}
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
          HAS_LANGUAGES: ${{ needs.detect.outputs.has-languages }}
          SEVERITY_RESULT: ${{ needs.severity.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DETECTION_RESULT" != success ]]; then
            echo "::error::Language detection did not succeed."
            exit 1
          fi
          if [[ "$SEVERITY_RESULT" != success ]]; then
            echo "::error::Security severity evaluation did not succeed: $SEVERITY_RESULT"
            exit 1
          fi
          if [[ "$ANALYSIS_RESULT" == success ]]; then
            echo "CodeQL CLI analysis and SARIF upload succeeded." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ANALYSIS_RESULT" == skipped && "$HAS_LANGUAGES" == false ]]; then
            echo "No supported languages selected; CodeQL CLI analysis was skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::CodeQL CLI analysis did not succeed: $ANALYSIS_RESULT"
            exit 1
          fi
